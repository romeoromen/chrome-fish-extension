<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
      width: 240px;
      margin: 0;
    }
    h3 { margin: 0 0 12px; font-size: 16px; }
    button {
      width: 100%;
      padding: 8px 12px;
      margin-top: 8px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      font-size: 14px;
    }
    button:hover { background: #f5f5f5; }
    #status {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
      min-height: 16px;
    }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h3>🐟 Fish Calendar</h3>
  <button id="loginBtn">Google でログイン</button>
  <button id="testBtn">テスト魚を流す</button>
  <div id="status">読み込み中...</div>
  <script src="popup.js"></script>
</body>
</html>
